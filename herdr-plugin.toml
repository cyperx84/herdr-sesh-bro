id = "sesh-bro"
name = "Sesh Bro"
version = "0.6.0"
min_herdr_version = "0.8.2"
# 0.8.2 is the floor because popup.close and session.snapshot are only
# confirmed present in the 0.8.2 API schema — the popup toggle (0.4.0) and
# the single-snapshot list path both depend on them. (0.3.0 shipped with
# 0.8.0, which lacks them.)
description = "sesh-style fuzzy picker for Herdr — workspaces, agents, and zoxide dirs with live pane previews"
# Windows is deliberately NOT listed, even though fzf and zoxide both ship
# Windows builds: this plugin's fzf integration (internal/picker) single-
# quotes its --preview/--bind command strings POSIX-style (BuildArgs'
# quoteSingle) for the `$SHELL -c` fzf invokes them through on Linux/macOS.
# On native Windows fzf instead runs bind/preview commands via `cmd /c`
# unless $SHELL points at a POSIX shell (e.g. Git Bash), so that quoting
# would be silently wrong — every reload/preview keybinding would break, not
# just degrade. The picker's failure-prompt keypress
# (internal/picker.waitForKeypress) also opens /dev/tty directly, which does
# not exist on Windows. Advertising "windows" here would be a lie about
# what actually works; it stays off the list until the picker's shell/tty
# assumptions are addressed as their own deliberate change, not a side
# effect of this rewrite.
platforms = ["linux", "macos"]
repository = "https://github.com/cyperx84/herdr-sesh-bro"
license = "MIT"
authors = ["cyperx"]

# Compiled Go plugin: prefer a local toolchain build for an exact source
# match, fall back to a SHA256-verified prebuilt from GitHub Releases.
# Pattern adopted from herdr-loop's own [[build]]/scripts/build.sh — see
# that script's header comment for the full rationale. Runs once, on
# `plugin install`, after user confirmation.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

# Startup: validate dependencies once per server start. (It used to also clear
# a stale pane cache; that cache was removed in 0.4.0 when session.snapshot
# replaced the reads it existed to soften.) A startup failure is logged but
# does not stop the server.
[[startup]]
command = ["./bin/sesh-bro", "startup"]

# User-configurable settings, exposed through Herdr's config UI. Each maps to
# a SESH_BRO_* env var the binary reads; defaults live in [default_config].
[config]
preview_width = { type = "string", default = "60%" }
preview_enabled = { type = "boolean", default = true }
hide_current = { type = "boolean", default = false }
dir_sources = { type = "boolean", default = true }
attention_first = { type = "boolean", default = true }
default_filter = { type = "string", default = "all" }

[default_config]
preview_width = "60%"
preview_enabled = true
hide_current = false
dir_sources = true
attention_first = true
default_filter = "all"

[[panes]]
id = "picker"
title = "Sesh Bro"
placement = "popup"
width = "80%"
height = "70%"
command = ["./bin/sesh-bro", "picker"]

[[actions]]
id = "open"
title = "Open sesh-bro picker"
contexts = ["workspace"]
command = ["./bin/sesh-bro", "open"]

[[actions]]
id = "agents"
title = "Open sesh-bro picker (agents only)"
contexts = ["workspace"]
command = ["./bin/sesh-bro", "open", "--agents"]

[[actions]]
id = "blocked"
title = "Open sesh-bro picker (blocked agents)"
contexts = ["workspace"]
command = ["./bin/sesh-bro", "open", "--blocked"]

# One-keypress jumps to whoever needs you, for a [[keys.command]] binding.
# Contexts include "global" so the binding works from any pane, not only one
# with a workspace context.
[[actions]]
id = "next"
title = "Jump to next agent needing attention"
contexts = ["global", "workspace"]
command = ["./bin/sesh-bro", "next"]

[[actions]]
id = "prev"
title = "Jump to previous agent needing attention"
contexts = ["global", "workspace"]
command = ["./bin/sesh-bro", "prev"]

# Workspace navigation, bindable as sesh-bro.last / sesh-bro.root
# (github.com/cyperx84/herdr-sesh-bro/issues/2 asked for `last` specifically:
# it worked as a CLI command from the start but was never exposed as an action,
# so `command = "sesh-bro.last"` had nothing to bind to). "global" context so
# the binding works from any pane, not only one with a workspace context.
[[actions]]
id = "last"
title = "Toggle to the last workspace"
contexts = ["global", "workspace"]
command = ["./bin/sesh-bro", "last"]

[[actions]]
id = "root"
title = "Focus or create the workspace for the current git root"
contexts = ["global", "workspace"]
command = ["./bin/sesh-bro", "root"]

# Invoked by the github-worktree link handler; also runnable from the palette.
[[actions]]
id = "worktree"
title = "Open GitHub issue/PR worktree"
contexts = ["workspace"]
command = ["./bin/sesh-bro", "worktree"]

# Record when each agent entered its state, and which workspaces you visited.
#
# herdr exposes no timestamp for a status change (discussions #707, #3619), so
# "blocked for 9m" has to be timed locally by noticing the transition. These
# hooks fire for EVERY pane with no per-pane registration — unlike
# events.subscribe, whose status subscription requires a pane_id — so this
# costs one short-lived process per state change rather than a resident daemon.
#
# `on` must be the DOTTED name. The underscored spelling is rejected with a
# non-fatal warning in `herdr plugin list --json` and the hook silently never
# fires, which is a very quiet way to lose a feature.
[[events]]
on = "pane.agent_status_changed"
command = ["./bin/sesh-bro", "record-event"]

[[events]]
on = "workspace.focused"
command = ["./bin/sesh-bro", "record-event"]

# Ctrl-click a GitHub issue/PR URL in any pane: create or focus the worktree
# workspace for that issue. Parses HERDR_PLUGIN_CLICKED_URL in the command.
[[link_handlers]]
id = "github-worktree"
title = "Open GitHub issue/PR worktree in Herdr"
pattern = "^https://github\\.com/[^/]+/[^/]+/(issues|pull)/[0-9]+$"
action = "worktree"
